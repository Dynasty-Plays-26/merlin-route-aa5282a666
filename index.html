<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1c48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Merlin Route">
<title>Merlin Route</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <img class="mark" src="icons/merlin-mark-96.png" alt="Merlin">
      <div>
        <div class="route-name"><span class="by">Merlin</span> <span id="routeName">Route</span></div>
        <div class="route-date" id="routeDate"></div>
      </div>
    </div>
    <div class="status">
      <span class="pill" id="netPill">Online</span>
      <span class="pill pill-warn" id="queuePill" hidden></span>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-text" id="progressText"></div>
  <nav class="tabs" aria-label="Sections">
  <button class="tab" data-tab="route" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Route</button>
  <button class="tab" data-tab="summary">
    <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Summary</button>
  <button class="tab" data-tab="stops">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z" stroke="currentColor" stroke-width="2.2" fill="none"/><circle cx="12" cy="9.5" r="2.3" fill="currentColor"/></svg>Stops</button>
  <button class="tab" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Settings</button>
</nav>
</header>

<main id="view" tabindex="-1"></main>


<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="roster.js"></script>
<script src="app.js"></script>
</body>
</html>
